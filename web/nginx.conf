# 该文件被包含进 nginx.conf 的 http {} 块，故 map 可用
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 视频最大 500MB，放开上传体积
    client_max_body_size 512m;

    root /usr/share/nginx/html;
    index index.html;

    # hash 路由，静态资源优先，其余回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api（含 WebSocket /api/task/stream）反代到 BFF 容器
    location /api/ {
        proxy_pass http://bff:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 图片/音频/视频分析耗时较长，放宽超时。
        # 注意 proxy_connect_timeout 只管"建立连接"这一步，和请求本身要做多久无关：
        # bff 容器停掉时连接会一直挂着，这个值就是前端要干等多久才看到失败——
        # 15s 会让每个接口（工作区同步、连接器、AI 对话）都各卡 15 秒，调成 5s。
        # 后面两个 900s 是长任务的读取/发送超时，别动。
        proxy_connect_timeout 5s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
        proxy_buffering       off;
    }
}
