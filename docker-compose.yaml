name: data-cleansing

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: data_cleansing
    ports:
      - "5432:5432" # 本地不跑 bff 容器、直接 npm run dev 调试时需要连到宿主机端口，可删
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    image: data-cleansing-bff
    # 全部火山密钥从仓库根 .env 注入（不进镜像）
    env_file:
      - .env
    environment:
      BFF_PORT: "8787"
      # 浏览器实际访问的地址（nginx 端口），用于 CORS
      WEB_ORIGIN: "http://localhost:8080"
      FFMPEG_PATH: /usr/bin/ffmpeg
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/data_cleansing
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8787:8787" # 直连调试用，可删
    volumes:
      - ./exports:/app/exports # 数仓回传落盘
      - ./telemetry:/app/telemetry # 埋点落盘
      - ./uploads:/app/uploads # 原始素材落盘，历史回看 / 任务重启续跑用
      - ./jobs:/app/jobs # 后台任务槽心跳，容器重建后能接着跑
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1536m
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: data-cleansing-web
    ports:
      - "8080:80" # 打开 http://localhost:8080
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    restart: unless-stopped
