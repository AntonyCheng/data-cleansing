name: data-cleansing

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: data_cleansing
    # 不映射宿主机端口：bff 容器走 compose 网直连 db:5432。
    # 宿主机裸跑 bff（npm run dev）需要连库时，用 docker-compose.dev.yaml 起（见 README 本地开发）。
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  # 演示用"外部数据源"：与应用自己的 db 完全独立，只用来在"数据库连接器"演示时
  # 现场连接、拉取黑龙江省真实数据（4 张表，见 demo-data/heilongjiang-init.sql 顶部的数据来源说明）。
  demo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-demo12345}
      POSTGRES_DB: heilongjiang
    # 同样不映射宿主机端口：连接器（跑在 bff 容器里）填 host=demo-db port=5432 走 compose 网。
    # 宿主机裸跑 bff 调试时要填 host=localhost port=5434，那需要 docker-compose.dev.yaml。
    volumes:
      - ./demo-data:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped

  # 演示用"外部 API + 演示网页"：轻量零依赖 Node 服务，内嵌黑龙江省真实年度序列数据
  # （对俄贸易 / 大庆油田，见 demo-api/data.json 的来源说明），演示"API 连接器"的
  # API Key 鉴权（X-Api-Key）和页码翻页；同时托管 /page/bulletin.html 静态公报页，
  # 供"URL / 网页"来源演示真实抓取与表格解析。不映射宿主机端口：
  # bff 容器抓网页/调 API 走 compose 网 http://demo-api:8090；
  # 本机裸跑 bff 调试要填 http://localhost:8090 的话，用 docker-compose.dev.yaml。
  demo-api:
    build:
      context: ./demo-api
      dockerfile: Dockerfile
    image: data-cleansing-demo-api
    environment:
      DEMO_API_KEY: ${DEMO_API_KEY:-hlj-demo-2026}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    image: data-cleansing-bff
    # 全部火山密钥从仓库根 .env 注入（不进镜像）
    env_file:
      - .env
    environment:
      BFF_PORT: "8787"
      # 浏览器实际访问的地址（nginx 端口），用于 CORS
      WEB_ORIGIN: "http://localhost:8080"
      FFMPEG_PATH: /usr/bin/ffmpeg
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/data_cleansing
    depends_on:
      db:
        condition: service_healthy
    # 不映射宿主机端口：浏览器只经 web 的 nginx 走 /api/ 反代过来（见 web/nginx.conf）。
    # 要绕过 nginx 直连容器 bff 调试时，用 docker-compose.dev.yaml。
    volumes:
      - ./exports:/app/exports # 数仓回传落盘
      - ./telemetry:/app/telemetry # 埋点落盘
      - ./uploads:/app/uploads # 原始素材落盘，历史回看 / 任务重启续跑用
      - ./jobs:/app/jobs # 后台任务槽心跳，容器重建后能接着跑
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1536m
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: data-cleansing-web
    # 全栈唯一对外暴露的端口：nginx 托管前端静态资源，并把 /api/（含 WebSocket）反代给 bff:8787。
    # 其余服务一律不映射宿主机端口——db/demo-db/demo-api 都只在 compose 网内被 bff 访问。
    ports:
      - "8080:80" # 打开 http://localhost:8080
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    restart: unless-stopped
